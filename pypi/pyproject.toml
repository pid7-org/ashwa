[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "ashwa"
version = "0.2.4"
description = "Hardware accelerated routines for single substring search"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
keywords = ["ashwa", "memmem", "substring", "find", "search", "simd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: General",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/pid7-org/ashwa"
Repository = "https://github.com/pid7-org/ashwa"
Issues = "https://github.com/pid7-org/ashwa/issues"
Changelog = "https://github.com/pid7-org/ashwa/blob/master/CHANGELOG.md"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "ashwa"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
