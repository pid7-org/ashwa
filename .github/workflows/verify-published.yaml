name: Verify Published Packages

on:
  workflow_dispatch:

jobs:
  resolve-version:
    name: resolve-version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract most recent tag
        id: get-version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep '^v[0-9]' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "Error: Failed to find any release version tag matching pattern 'v*.*.*'"
            exit 1
          fi
          VERSION="${LATEST_TAG#v}"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved most recent tag: $LATEST_TAG (version: $VERSION)"

  test-npm-node:
    name: test-npm-node (${{ matrix.name }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-x86_64"
            os: ubuntu-latest
            arch: x64

          - name: "linux-aarch64"
            os: ubuntu-24.04-arm
            arch: arm64

          - name: "macos-aarch64"
            os: macos-latest
            arch: arm64

          - name: "windows-x86_64"
            os: windows-latest
            arch: x64

          - name: "windows-aarch64"
            os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}

      - name: Download & verify published @pid7/ashwa package (Node.js Native)
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p test-runner
          cd test-runner
          npm init -y

          installed=false
          for i in {1..30}; do
            if npm install "@pid7/ashwa@$VERSION" --prefer-online; then
              installed=true
              break
            fi
            echo "Waiting for @pid7/ashwa@$VERSION on npm registry (attempt $i/30)..."
            sleep 10
          done

          if [ "$installed" = false ]; then
            echo "Failed to install @pid7/ashwa@$VERSION from npm registry after 30 attempts."
            exit 1
          fi

          node --test ../npm/tests/node.test.js ../npm/tests/node.test.mjs

  test-npm-browser:
    name: test-npm-browser
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download & verify published @pid7/ashwa package (Browser / WASM SIMD)
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p test-runner
          cd test-runner
          npm init -y

          installed=false
          for i in {1..30}; do
            if npm install "@pid7/ashwa@$VERSION" --prefer-online; then
              installed=true
              break
            fi
            echo "Waiting for @pid7/ashwa@$VERSION on npm registry (attempt $i/30)..."
            sleep 10
          done

          if [ "$installed" = false ]; then
            echo "Failed to install @pid7/ashwa@$VERSION from npm registry after 30 attempts."
            exit 1
          fi

          npm install playwright
          npx playwright install --with-deps chromium
          node --test ../npm/tests/wasm.test.js ../npm/tests/wasm.test.mjs ../npm/tests/browser.test.mjs

  test-pypi:
    name: test-pypi (${{ matrix.name }})
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-x86_64"
            os: ubuntu-latest

          - name: "linux-aarch64"
            os: ubuntu-24.04-arm

          - name: "macos-aarch64"
            os: macos-latest

          - name: "windows-x86_64"
            os: windows-latest

          - name: "windows-aarch64"
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download & verify published ashwa package with pytest
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          installed=false
          for i in {1..30}; do
            if pip install "ashwa==$VERSION" --no-cache-dir; then
              installed=true
              break
            fi
            echo "Waiting for ashwa==$VERSION on PyPI (attempt $i/30)..."
            sleep 10
          done

          if [ "$installed" = false ]; then
            echo "Failed to install ashwa==$VERSION from PyPI after 30 attempts."
            exit 1
          fi

          pip install pytest
          cd pypi
          pytest
