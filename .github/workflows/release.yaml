name: Publish & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  lints:
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            toolchain: nightly
            rustflags: "-C target-feature=+avx2,+sse2 --cfg forced_swar_backend"
          - os: ubuntu-24.04-arm
            arch: aarch64
            toolchain: stable
            rustflags: "-C target-feature=+neon --cfg forced_swar_backend"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}

      - name: check (${{ matrix.arch }})
        run: RUSTFLAGS="${{matrix.rustflags}}" cargo check --workspace --all-targets --all-features --tests --benches --examples

      - name: Install supported targets
        run: |
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-linux-android \
            x86_64-unknown-freebsd \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            aarch64-pc-windows-msvc \
            aarch64-linux-android \
            i686-unknown-linux-gnu \
            i686-pc-windows-msvc \
            armv7-unknown-linux-gnueabihf \
            armv7-linux-androideabi \
            wasm32-unknown-unknown \
            wasm32-wasip2

      - name: check supported targets
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-linux-android \
            x86_64-unknown-freebsd \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            aarch64-pc-windows-msvc \
            aarch64-linux-android \
            i686-unknown-linux-gnu \
            i686-pc-windows-msvc \
            armv7-unknown-linux-gnueabihf \
            armv7-linux-androideabi \
            wasm32-unknown-unknown \
            wasm32-wasip2; do
            cargo check -p ashwa --all-targets --all-features --target "$target"
          done

  npm-wasm32:
    name: npm-wasm32
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: npm/package.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-ubuntu-latest-npm-wasm-release

      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-v0.13.1

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          cd npm
          npm ci || npm install
          npm run build:wasm

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: npm/wasm/pkg/

  native-artifacts:
    name: native (${{ matrix.name }})
    needs: lints
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-x86_64"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            toolchain: nightly
            rustflags: "-C target-cpu=native"

          - name: "linux-aarch64"
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            toolchain: stable
            rustflags: ""

          - name: "macos-aarch64"
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            toolchain: stable
            rustflags: ""

          - name: "windows-x86_64"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            toolchain: nightly
            rustflags: "-C target-cpu=native"

          - name: "windows-aarch64"
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            toolchain: stable
            rustflags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: "npm"
          cache-dependency-path: npm/package.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.target }}-${{ matrix.toolchain }}-release-native

      - name: Build native addon
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cd npm
          npm ci || npm install
          cd native
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: npm/native/*.node

      - name: Build PyPI wheel
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ matrix.toolchain }}
          args: --release --locked --find-interpreter --out dist -m pypi/Cargo.toml
          sccache: 'true'

      - name: Upload PyPI wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl

  pypi-cross:
    name: pypi-cross (${{ matrix.name }})
    needs: lints
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-armv7"
            target: armv7-unknown-linux-gnueabihf

          - name: "linux-i686"
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: 2014
          args: --release --locked --find-interpreter --out dist -m pypi/Cargo.toml
          sccache: 'true'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl

  pypi-sdist:
    name: pypi-sdist
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m pypi/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz

  publish-crates:
    name: publish-crates
    needs: [lints, npm-wasm32, native-artifacts, pypi-cross, pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Dry Run — crates.io
        run: cargo publish --dry-run --locked

      - name: Publish — crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: publish-npm
    needs: [publish-crates, npm-wasm32, native-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@pid7'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: npm/wasm/pkg

      - name: Download Native addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: npm/native
          merge-multiple: true

      - name: Verify bundled npm package contents
        run: |
          ls -la npm/native/*.node
          ls -la npm/wasm/pkg

      - name: Dry Run — npm
        working-directory: npm
        run: npm pack --dry-run

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Publish — npm (Trusted Publishing via OIDC)
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: publish-pypi
    needs: [publish-crates, native-artifacts, pypi-cross, pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download all PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Verify PyPI package contents
        run: ls -la dist/

      - name: Publish — PyPI (Trusted Publishing via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  test-npm:
    name: test-npm (${{ matrix.name }})
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-x86_64"
            os: ubuntu-latest
            arch: x64

          - name: "linux-aarch64"
            os: ubuntu-24.04-arm
            arch: arm64

          - name: "macos-aarch64"
            os: macos-latest
            arch: arm64

          - name: "windows-x86_64"
            os: windows-latest
            arch: x64

          - name: "windows-aarch64"
            os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}

      - name: Download & verify published @pid7/ashwa package
        shell: bash
        run: |
          mkdir -p test-published-package
          cd test-published-package
          npm init -y

          for i in {1..6}; do
            npm install @pid7/ashwa@latest --no-cache && break || sleep 10
          done

          cat << 'EOF' > test.js
          const { test, describe } = require("node:test");
          const assert = require("node:assert/strict");
          const { searchOne, isNative, init, initSync } = require("@pid7/ashwa");

          describe("Node Native Published Package", () => {
            test("Environment & exports verification", async () => {
              assert.strictEqual(isNative, true);
              assert.strictEqual(typeof searchOne, "function");
              assert.strictEqual(typeof init, "function");
              assert.strictEqual(typeof initSync, "function");
              await init();
              initSync();
            });

            test("Basic searchOne operations", () => {
              const haystack = Buffer.from("abcdefghijklmnopqrstuvwxyz");
              assert.strictEqual(searchOne(haystack, "a".charCodeAt(0)), 0);
              assert.strictEqual(searchOne(haystack, "m".charCodeAt(0)), 12);
              assert.strictEqual(searchOne(haystack, "z".charCodeAt(0)), 25);
              assert.strictEqual(searchOne(haystack, "A".charCodeAt(0)), null);
            });

            test("Empty buffer search", () => {
              assert.strictEqual(searchOne(new Uint8Array(0), 65), null);
              assert.strictEqual(searchOne(Buffer.alloc(0), 65), null);
            });

            test("Multiple occurrences return first match", () => {
              const haystack = Buffer.from("banana");
              assert.strictEqual(searchOne(haystack, "a".charCodeAt(0)), 1);
              assert.strictEqual(searchOne(haystack, "n".charCodeAt(0)), 2);
            });

            test("Binary data & extreme byte values", () => {
              const data = new Uint8Array([0x10, 0x20, 0x00, 0x30, 0xff, 0x40]);
              assert.strictEqual(searchOne(data, 0x00), 2);
              assert.strictEqual(searchOne(data, 0xff), 4);
              assert.strictEqual(searchOne(data, 0x99), null);
            });

            test("Buffer types compatibility", () => {
              const rawArray = [10, 20, 30, 40, 50, 60, 70, 80];
              const uint8 = new Uint8Array(rawArray);
              const nodeBuf = Buffer.from(rawArray);
              const subarray = uint8.subarray(2, 6);
              assert.strictEqual(searchOne(uint8, 50), 4);
              assert.strictEqual(searchOne(nodeBuf, 50), 4);
              assert.strictEqual(searchOne(subarray, 50), 2);
            });
          });
          EOF

          node --test test.js

  test-pypi:
    name: test-pypi (${{ matrix.name }})
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux-x86_64"
            os: ubuntu-latest

          - name: "linux-aarch64"
            os: ubuntu-24.04-arm

          - name: "macos-aarch64"
            os: macos-latest

          - name: "windows-x86_64"
            os: windows-latest

          - name: "windows-aarch64"
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download & verify published ashwa package with pytest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in {1..12}; do
            pip install "ashwa==$VERSION" --no-cache-dir && break || sleep 10
          done

          pip install pytest
          cd pypi
          pytest

  release:
    name: github-release
    needs: [test-npm, test-pypi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read CHANGELOG
        id: changelog
        shell: bash
        run: |
          body=$(awk '
            /^## / {
              if (seen) exit
              seen=1
            }
            seen
          ' CHANGELOG.md)

          {
            echo 'body<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release of ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
