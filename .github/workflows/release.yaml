name: Publish & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  lints:
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            rustflags: "-C target-feature=+avx2,+sse2 --cfg forced_swar_backend"
          - os: ubuntu-24.04-arm
            arch: aarch64
            rustflags: "-C target-feature=+neon --cfg forced_swar_backend"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.arch }}-stable

      - name: check (${{ matrix.arch }})
        run: RUSTFLAGS="${{matrix.rustflags}}" cargo check --workspace --all-targets --all-features --tests --benches --examples

  build-wasm:
    name: Build WASM Package
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: npm/package.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-ubuntu-latest-npm-wasm-release

      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-v0.13.1

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          cd npm
          npm ci || npm install
          npm run build:wasm

      - name: Upload WASM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: npm/wasm/pkg/

  build-native:
    name: Build Native (${{ matrix.name }})
    needs: lints
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x64 (Linux)"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64

          - name: "AArch64 (Linux)"
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64

          - name: "AArch64 (Macos)"
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64

          - name: "x64 (Windows 11)"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

          - name: "AArch64 (Windows 11)"
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: "npm"
          cache-dependency-path: npm/package.json

      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-${{ runner.os }}-${{ matrix.target }}-release-native

      - name: Build native addon
        run: |
          cd npm
          npm ci || npm install
          cd native
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: npm/native/*.node

  build-pypi-wheels:
    name: Build PyPI Wheel (${{ matrix.name }})
    needs: lints
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x86_64 (Linux)"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - name: "AArch64 (Linux)"
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - name: "AArch64 (macOS)"
            os: macos-latest
            target: aarch64-apple-darwin

          - name: "x86_64 (Windows)"
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: "AArch64 (Windows)"
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --find-interpreter --out dist -m pypi/Cargo.toml
          sccache: 'true'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl

  build-pypi-wheels-cross:
    name: Build PyPI Wheel (${{ matrix.name }})
    needs: lints
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ARMv7 (Linux)"
            target: armv7-unknown-linux-gnueabihf

          - name: "i686 (Linux)"
            target: i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --find-interpreter --out dist -m pypi/Cargo.toml
          sccache: 'true'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl

  build-pypi-sdist:
    name: Build PyPI sdist
    needs: lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m pypi/Cargo.toml

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz

  publish-crates:
    name: Publish crates.io
    needs: [lints, build-wasm, build-native, build-pypi-wheels, build-pypi-wheels-cross, build-pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Dry Run — crates.io
        run: cargo publish --dry-run --locked

      - name: Publish — crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish npm
    needs: [publish-crates, build-wasm, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@pid7'

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: npm/wasm/pkg

      - name: Download Native addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: npm/native
          merge-multiple: true

      - name: Verify bundled npm package contents
        run: |
          ls -la npm/native/*.node
          ls -la npm/wasm/pkg

      - name: Dry Run — npm
        working-directory: npm
        run: npm pack --dry-run

      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Publish — npm (Trusted Publishing via OIDC)
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI
    needs: [publish-crates, build-pypi-wheels, build-pypi-wheels-cross, build-pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download all PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Verify PyPI package contents
        run: ls -la dist/

      - name: Publish — PyPI (Trusted Publishing via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  test-published-npm:
    name: Test npm (${{ matrix.name }})
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x64 (Linux)"
            os: ubuntu-latest
            arch: x64

          - name: "AArch64 (Linux)"
            os: ubuntu-24.04-arm
            arch: arm64

          - name: "AArch64 (Macos)"
            os: macos-latest
            arch: arm64

          - name: "x64 (Windows 11)"
            os: windows-latest
            arch: x64

          - name: "AArch64 (Windows 11)"
            os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}

      - name: Download & verify published @pid7/ashwa package
        shell: bash
        run: |
          mkdir -p test-published-package
          cd test-published-package
          npm init -y

          for i in {1..6}; do
            npm install @pid7/ashwa@latest --no-cache && break || sleep 10
          done

          node -e '
            const ashwa = require("@pid7/ashwa");
            console.log("Successfully imported @pid7/ashwa!");
            console.log("isNative:", ashwa.isNative);
            const haystack = Buffer.from("hello world");
            const res = ashwa.searchOne(haystack, "w".charCodeAt(0));
            console.log("Search result index:", res);
            if (res !== 6) {
              console.error("Expected index 6, got:", res);
              process.exit(1);
            }
            console.log("Verification passed successfully!");
          '

  test-published-pypi:
    name: Test PyPI (${{ matrix.name }})
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "x86_64 (Linux)"
            os: ubuntu-latest

          - name: "AArch64 (Linux)"
            os: ubuntu-24.04-arm

          - name: "AArch64 (macOS)"
            os: macos-latest

          - name: "x86_64 (Windows)"
            os: windows-latest

          - name: "AArch64 (Windows)"
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download & verify published ashwa package with pytest
        shell: bash
        run: |
          for i in {1..6}; do
            pip install ashwa --no-cache-dir && break || sleep 10
          done

          pip install pytest
          cd pypi
          pytest

  release:
    name: GitHub Release
    needs: [test-published-npm, test-published-pypi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read CHANGELOG
        id: changelog
        shell: bash
        run: |
          body=$(awk '
            /^## / {
              if (seen) exit
              seen=1
            }
            seen
          ' CHANGELOG.md)

          {
            echo 'body<<EOF'
            echo "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release of ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
